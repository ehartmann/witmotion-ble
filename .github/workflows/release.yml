name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is vMAJOR.MINOR.PATCH
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build the release artifacts
        run: ./gradlew testDebugUnitTest publishAllPublicationsToReleaseRepository -PlibVersion="${GITHUB_REF_NAME#v}" --no-daemon

      - name: Create the GitHub Release with the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          { echo "## Changes"; echo; git log --format='- %s (%h)' "${previous:+$previous..}$GITHUB_REF_NAME"; } > notes.md
          gh release create "$GITHUB_REF_NAME" build/release-repo/* --title "$GITHUB_REF_NAME" --notes-file notes.md
